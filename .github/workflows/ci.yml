name: CI

on:
  push:
  pull_request:

env:
  LLVM_TAG: llvmorg-18.1.8

jobs:
  # The core (placement engine, target reader, runtime, cim-bench) has no
  # LLVM/MLIR dependency, so it builds and tests in seconds. Running it as a
  # separate job means a broken algorithm is reported immediately rather
  # than after an LLVM build.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (core only, no MLIR)
        run: cmake -S . -B build -G Ninja -DCIM_ENABLE_MLIR=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke run
        run: |
          ./build/tools/cim-bench/cim-bench run --target erbium-8t \
            --out results-erbium-8t.json --inferences 100
          ./build/tools/cim-bench/cim-bench run --target generic-digital-cim \
            --out results-generic-digital-cim.json --inferences 100

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results-*.json

  lint-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate target YAML files
        run: |
          python3 -c "
          import glob, yaml
          for f in sorted(glob.glob('targets/*.yaml')):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'OK: {f}')
          "

  # The MLIR layer: dialect, lowering passes, cim-opt, and the FileCheck
  # suite. MLIR is not distributed as an apt package and there is no
  # prebuilt artifact worth trusting, so LLVM+MLIR is built from source and
  # cached by tag -- only the first run (or a tag bump) pays the ~45-90 min
  # build cost.
  mlir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache LLVM/MLIR build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-install
          key: llvm-mlir-${{ runner.os }}-${{ env.LLVM_TAG }}-v1

      - name: Build LLVM/MLIR
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LLVM_TAG }} https://github.com/llvm/llvm-project.git
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install"
          cmake --build llvm-build --target install -j"$(nproc)"

      - name: Configure cim-mlir
        run: |
          cmake -S . -B build -G Ninja \
            -DMLIR_DIR="$PWD/llvm-install/lib/cmake/mlir" \
            -DLLVM_DIR="$PWD/llvm-install/lib/cmake/llvm" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build cim-opt
        run: cmake --build build --target cim-opt -j"$(nproc)"

      - name: Dialect tests (FileCheck)
        run: cmake --build build --target check-cim-opt
