name: CI

on:
  push:
  pull_request:

env:
  LLVM_TAG: llvmorg-18.1.8

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # LLVM/MLIR is not distributed as an apt package, so it is built from
      # source here and cached by tag — only the first run (or a tag bump)
      # pays the full build cost (~45-90 min); subsequent runs restore the
      # install prefix from cache in seconds.
      - name: Cache LLVM/MLIR build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: llvm-install
          key: llvm-mlir-${{ runner.os }}-${{ env.LLVM_TAG }}-v1

      - name: Build LLVM/MLIR
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ env.LLVM_TAG }} https://github.com/llvm/llvm-project.git
          cmake -S llvm-project/llvm -B llvm-build -G Ninja \
            -DLLVM_ENABLE_PROJECTS=mlir \
            -DLLVM_TARGETS_TO_BUILD=host \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/llvm-install"
          cmake --build llvm-build --target install -j"$(nproc)"

      - name: Configure cim-mlir
        run: |
          cmake -S . -B build -G Ninja \
            -DMLIR_DIR="$PWD/llvm-install/lib/cmake/mlir" \
            -DLLVM_DIR="$PWD/llvm-install/lib/cmake/llvm" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build cim-opt and cim-bench
        run: cmake --build build --target cim-opt cim-bench -j"$(nproc)"

      - name: Run FileCheck tests
        run: cmake --build build --target check-cim-opt

  lint-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate target YAML files
        run: |
          python3 -c "
          import glob, sys, yaml
          for f in glob.glob('targets/*.yaml'):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'OK: {f}')
          "
