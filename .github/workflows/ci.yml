name: CI

on:
  push:
  pull_request:

jobs:
  # The core (placement engine, target reader, runtime, cim-bench) has no
  # LLVM/MLIR dependency, so it builds and tests in seconds. Running it as a
  # separate job means a broken algorithm is reported immediately.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (core only, no MLIR)
        run: cmake -S . -B build -G Ninja -DCIM_ENABLE_MLIR=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke run
        run: |
          ./build/bin/cim-bench run --target erbium-8t \
            --out results-erbium-8t.json --inferences 100
          ./build/bin/cim-bench run --target generic-digital-cim \
            --out results-generic-digital-cim.json --inferences 100
          ./build/bin/cim-bench run --target upmem-like \
            --out results-upmem-like.json --inferences 100

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: results-*.json

  lint-targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate target YAML files
        run: |
          python3 -c "
          import glob, yaml
          for f in sorted(glob.glob('targets/*.yaml')):
              with open(f) as fh:
                  yaml.safe_load(fh)
              print(f'OK: {f}')
          "

  # The MLIR layer: dialect, lowering passes, cim-opt, and the FileCheck
  # suite. Ubuntu ships MLIR 18 as a distro package, so this installs it
  # rather than building LLVM from source -- the from-source route costs
  # 45-90 minutes on a cold cache and buys nothing here, because the dialect
  # only uses stable public MLIR APIs.
  mlir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM/MLIR 18 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build \
            llvm-18-dev libmlir-18-dev mlir-18-tools
          pip install lit

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DMLIR_DIR=/usr/lib/llvm-18/lib/cmake/mlir \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm \
            -DLLVM_EXTERNAL_LIT="$(which lit)" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build everything
        run: cmake --build build -j"$(nproc)"

      - name: Core unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Dialect tests (FileCheck)
        run: cmake --build build --target check-cim-opt
