# tiny-4x4 with ONE field changed: tiles.weight_dtype is i4, a width the
# functional simulator does not implement.
#
# This file must PARSE cleanly (it is well-formed YAML with every required
# field present, and `cim-bench dump-target` is expected to read it) while
# being REFUSED by cimrt_open, which is where execution begins. That split
# is the point: being able to inspect a vendor's spec before you can run it
# is useful, so "I cannot parse this" and "I cannot execute this" are
# deliberately different answers given at different places.
#
# i4 is not a nonsense value -- test/python/schema.py generates it as a
# valid dtype spelling, so it is a shape a real vendor file could carry.
# Before cimrt_open checked, a target like this opened cleanly, executed
# with int8_t reinterpretation, and was charged full declared mvm cost.
# test/targets/tiny-4x4.yaml
#
# A deliberately tiny device, for tests only -- not a model of real hardware.
#
# The shipped targets have 256x256 tiles, which means any end-to-end test that
# has to spell its weights out as a `dense<>` literal needs 65536 elements per
# tile block. With 4x4 tiles a whole multi-block matmul fits in a few lines of
# IR, and -- more importantly -- 2 tiles against a 3+ block workload makes
# eviction reachable in a test, which 8 tiles of 256x256 never would.
#
# The cost numbers are round and arbitrary. Nothing should read them as a
# claim about any device; they exist so cost arithmetic has something to
# multiply.

name: tiny-4x4
description: Tiny synthetic target for tests (2 tiles of 4x4)
version: 0.1

class: digital_cim

provenance: estimated  # synthetic; not measured, not modelling any real part

tiles:
  count: 2
  rows: 4
  cols: 4
  weight_dtype: i4
  activation_dtype: i8
  accumulator_dtype: i32
  persistent: true
  persistence: nonvolatile

costs:
  program:
    latency_ns: 1000
    energy_pj: 10000
  mvm:
    latency_ns: 10
    energy_pj: 100
  requantize:
    latency_ns: 5
    energy_pj: 50
  reduce_partial:
    latency_ns: 2
    energy_pj: 20
  # PLACEHOLDER, not measured: no hardware data exists for a
  # compare-and-select datapath on any of these targets. Deliberately
  # DIFFERENT from reduce_partial above so that charging a pooling
  # window against the adder's entry by mistake shows up as a wrong
  # number instead of an identical one.
  reduce_max:
    latency_ns: 3
    energy_pj: 25
  transfer:
    bandwidth_gbps: 1.0
    energy_pj_per_byte: 1.0
  standby_leakage_uw_per_tile: 0.0

precision:
  output_effective_bits: 8

capabilities:
  double_buffer_program: false
  partial_sum_in_place: true
  autonomous_control: false
