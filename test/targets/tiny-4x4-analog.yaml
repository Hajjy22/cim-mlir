# test/targets/tiny-4x4-analog.yaml
#
# Byte-identical to tiny-4x4.yaml except class: analog_cim instead of
# digital_cim, and this comment block. `name:` is deliberately left as
# "tiny-4x4" (not renamed to match the file) -- this fixture is never
# opened by cimrt (no real-target-e2e binary uses it), only parsed and run
# through compiler passes for a structural diff against tiny-4x4.yaml's
# own output, so keeping the device name identical means that diff has
# nothing incidental to filter out.
#
# tiny-4x4-4bit.yaml also declares class: analog_cim, but it additionally
# differs in precision.output_effective_bits, so a diff against it could
# never isolate class on its own -- see
# test/Transforms/cim-class-is-unread.mlir: every prior clean A/B pair in
# this suite (tiny-4x4-autonomous.yaml for capabilities.autonomous_control)
# changed exactly one field, and class had never gotten that treatment,
# exactly the gap docs/roadmap.md's M4 entry calls out and this fixture
# closes.

name: tiny-4x4
description: Tiny synthetic target for tests (2 tiles of 4x4), class analog_cim
version: 0.1

class: analog_cim

provenance: estimated  # synthetic; not measured, not modelling any real part

tiles:
  count: 2
  rows: 4
  cols: 4
  weight_dtype: i8
  activation_dtype: i8
  accumulator_dtype: i32
  persistent: true
  persistence: nonvolatile

costs:
  program:
    latency_ns: 1000
    energy_pj: 10000
  mvm:
    latency_ns: 10
    energy_pj: 100
  requantize:
    latency_ns: 5
    energy_pj: 50
  reduce_partial:
    latency_ns: 2
    energy_pj: 20
  transfer:
    bandwidth_gbps: 1.0
    energy_pj_per_byte: 1.0
  standby_leakage_uw_per_tile: 0.0

precision:
  output_effective_bits: 8

capabilities:
  double_buffer_program: false
  partial_sum_in_place: true
  autonomous_control: false
