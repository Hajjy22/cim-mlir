# test/targets/tiny-4x4-autonomous.yaml
#
# Byte-identical to tiny-4x4.yaml except capabilities.autonomous_control:
# true instead of false, and this comment block. `name:` is deliberately
# left as "tiny-4x4" (not renamed to match the file) -- this fixture is
# never opened by cimrt (no real-target-e2e binary uses it), only parsed
# and run through compiler passes for a structural diff against
# tiny-4x4.yaml's own output, so keeping the device name identical means
# that diff has nothing incidental to filter out.
#
# See test/Transforms/cim-autonomous-control-is-unread.mlir: every
# existing tiny-*.yaml fixture before this one declared
# autonomous_control: false, so nothing had ever exercised `true` past the
# parser -- exactly the gap docs/roadmap.md's M4 entry calls out and this
# fixture closes.

name: tiny-4x4
description: Tiny synthetic target for tests (2 tiles of 4x4), autonomous_control true
version: 0.1

class: digital_cim

provenance: estimated  # synthetic; not measured, not modelling any real part

tiles:
  count: 2
  rows: 4
  cols: 4
  weight_dtype: i8
  activation_dtype: i8
  accumulator_dtype: i32
  persistent: true
  persistence: nonvolatile

costs:
  program:
    latency_ns: 1000
    energy_pj: 10000
  mvm:
    latency_ns: 10
    energy_pj: 100
  requantize:
    latency_ns: 5
    energy_pj: 50
  reduce_partial:
    latency_ns: 2
    energy_pj: 20
  transfer:
    bandwidth_gbps: 1.0
    energy_pj_per_byte: 1.0
  standby_leakage_uw_per_tile: 0.0

precision:
  output_effective_bits: 8

capabilities:
  double_buffer_program: false
  partial_sum_in_place: true
  autonomous_control: true
